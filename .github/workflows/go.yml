name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

    - name: Setup Go environment
      uses: actions/setup-go@v6.0.0
      with:
        go-version: "1.25.1"

    - name: Checkout
      uses: actions/checkout@v5.0.0

    - name: Vendor dependencies
      run: go mod vendor

    - name: Build
      run: make build
      env:
        GOFLAGS: "-mod=vendor"

    - name: Test
      run: make test
      env:
        GOFLAGS: "-mod=vendor"